    var h = '<section class="etapa pilha-larga"><div class="pilha"><h2>' + esc(TD.pedido2_titulo) + '</h2><p>' + esc(TD.pedido2_texto) + '</p></div>';
    h += '<form class="pilha" data-form="contato" novalidate>';
    h += '<label class="campo"><span>' + esc(TD.pedido2_email) + '</span><input id="campo-email" name="email" type="email" inputmode="email" autocomplete="email" value="' + esc(estado.email) + '" placeholder="nome@exemplo.com"></label>';
    if (erros.email) h += '<p class="erro" role="alert">' + esc(TD.pedido2_erro_email) + '</p>';
    h += '<label class="campo"><span>' + esc(TD.pedido2_whatsapp) + '</span><input id="campo-whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" value="' + esc(estado.whatsapp) + '" placeholder="51 99999 9999"></label>';
    if (erros.whatsapp) h += '<p class="erro" role="alert">' + esc(TD.pedido2_erro_whatsapp) + '</p>';
    h += '<label class="marcar"><input id="campo-optin" name="optin" type="checkbox"' + (estado.optin ? ' checked' : '') + '><span>' + esc(TD.pedido2_optin) + '</span></label>';
    h += '<p class="nota">' + esc(TD.pedido2_privacidade) + '</p><p class="nota">' + esc(TD.prototipo_nada_enviado) + '</p>';
    h += '<div class="acoes acoes-fim"><button class="botao botao-texto" type="button" data-acao="voltar">' + esc(TD.voltar) + '</button><button class="botao botao-primario" type="submit">' + esc(TD.pedido2_botao) + '</button></div></form></section>';
    return h;
  }

  function telaPedido3() {
    var h = '<section class="etapa pilha-larga"><div class="pilha"><h2>' + esc(TD.pedido3_titulo) + '</h2><p>' + esc(TD.pedido3_porque) + '</p></div>';
    h += '<div class="pilha"><h3>' + esc(TD.pedido3_idade) + '</h3>' + chips("idade", D.idades, estado.idade) + '</div>';
    h += '<div class="pilha"><h3>' + esc(TD.pedido3_sexo) + '</h3>' + chips("sexo", D.sexos, estado.sexo) + '</div>';
    h += '<div class="acoes acoes-fim"><button class="botao botao-texto" data-acao="voltar">' + esc(TD.voltar) + '</button><div class="acoes">' +
      '<button class="botao botao-secundario" data-acao="ir-entrada4">' + esc(TD.pular) + '</button><button class="botao botao-primario" data-acao="ir-entrada4">' + esc(TD.pedido3_botao) + '</button></div></div></section>';
    return h;
  }

  function telaEntrega(fn) {
    return '<section class="resultado pilha">' + fn(estado, false) + '<div class="acoes"><button class="botao botao-texto" data-acao="inicio">' + esc(TD.voltar_inicio) + '</button></div></section>';
  }

  function telaExemplo() {
    var est = visao.dados;
    return '<section class="resultado pilha">' + marcaExemplo(visao.nome) + entrega1(est, true) + entrega2(est, true) + entrega3(est, true, "ex") + entrega4(est, true) +
      '<div class="acoes"><button class="botao botao-secundario" data-acao="inicio">' + esc(TD.voltar_inicio) + '</button></div></section>';
  }

  // ------------------------------------------------------------------ render e navegação
  function render() {
    var h;
    document.body.classList.toggle("tela-abertura", !visao && estado.etapa === "abertura");
    if (visao) h = telaExemplo();
    else if (estado.etapa === "abertura") h = telaAbertura();
    else if (estado.etapa === "triagem") h = telaTriagem();
    else if (estado.etapa === "entrada1") h = telaEntrada(1);
    else if (estado.etapa === "e1") h = telaSituacao(SIT1, 1);
    else if (estado.etapa === "entrega1") h = telaEntrega(entrega1);
    else if (estado.etapa === "entrada2") h = telaEntrada(2);
    else if (estado.etapa === "e2") h = telaAfirmacao(estado.filaE2, 2);
    else if (estado.etapa === "entrega2") h = telaEntrega(entrega2);
    else if (estado.etapa === "entrada3") h = telaEntrada(3);
    else if (estado.etapa === "e3") h = telaAfirmacao(estado.filaE3, 3);
    else if (estado.etapa === "pedido2") h = telaPedido2();
    else if (estado.etapa === "entrega3") h = telaEntrega(function (est, ex) { return entrega3(est, ex, "eu"); });
    else if (estado.etapa === "pedido3") h = telaPedido3();
    else if (estado.etapa === "entrada4") h = telaEntrada(4);
    else if (estado.etapa === "e4") h = telaSituacao(SIT4, 4);
    else h = telaEntrega(entrega4);
    raiz.innerHTML = h;
  }
  function irPara(etapa, i) { estado.etapa = etapa; estado.i = i || 0; erros = {}; salvar(); render(); window.scrollTo(0, 0); }
  function primeiraFalta(lista) { return lista.findIndex(function (s) { return (estado.ordens[s.id] || []).length !== 4; }); }
  function nenhumaFeita(lista) { return lista.every(function (s) { return !(estado.ordens[s.id] || []).length; }); }
  function retomar() {
    if (!Desc.triagemCompleta(estado)) return irPara("triagem");
    var falta = primeiraFalta(SIT1);
    if (falta >= 0) return nenhumaFeita(SIT1) ? irPara("entrada1") : irPara("e1", falta);
    if (!estado.principalE1) return irPara("entrega1");
    garantirFilas();
    falta = estado.filaE2.findIndex(function (id) { return estado.respostas[id] === undefined; });
    if (falta >= 0) return falta === 0 ? irPara("entrada2") : irPara("e2", falta);
    falta = estado.filaE3.findIndex(function (id) { return estado.respostas[id] === undefined; });
    if (falta >= 0) return falta === 0 ? irPara("entrada3") : irPara("e3", falta);
    if (!estado.email) return irPara("pedido2");
    falta = primeiraFalta(SIT4);
    if (falta >= 0) return nenhumaFeita(SIT4) ? irPara("entrada4") : irPara("e4", falta);
    irPara("entrega4");
  }
  function listaAtual() { return estado.etapa === "e1" ? SIT1 : SIT4; }
  function filaAtual() { return estado.etapa === "e2" ? estado.filaE2 : estado.filaE3; }

  raiz.addEventListener("submit", function (ev) {
    var form = ev.target.closest("form");
    if (!form) return;
    ev.preventDefault();
    if (form.getAttribute("data-form") === "nome") {
      estado.nome = (form.nome.value || "").trim();
      return irPara("triagem");
    }
    if (form.getAttribute("data-form") === "contato") {
      estado.email = (form.email.value || "").trim();
      estado.whatsapp = (form.whatsapp.value || "").trim();
      estado.optin = Boolean(form.optin.checked);
      erros = {};
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(estado.email)) erros.email = true;
      if (estado.whatsapp.replace(/\D/g, "").length < 10) erros.whatsapp = true;
      if (erros.email || erros.whatsapp) { salvar(); render(); return; }
      return irPara("entrega3");
    }
  });

  raiz.addEventListener("change", function (ev) {
    if (ev.target && ev.target.id === "racional-toggle") { racionalLigado = !!ev.target.checked; gravarRacional(racionalLigado); }
  });

  raiz.addEventListener("click", function (ev) {
    var alvo = ev.target.closest("[data-acao]");
    if (!alvo || alvo.disabled) return;
    var acao = alvo.getAttribute("data-acao"), valor = alvo.getAttribute("data-valor");

    if (acao === "continuar") return retomar();
    if (acao === "recomecar") { confirmandoRecomeco = true; return render(); }
    if (acao === "recomecar-nao") { confirmandoRecomeco = false; return render(); }
    if (acao === "recomecar-sim") { confirmandoRecomeco = false; estado = novoEstado(); salvar(); return render(); }
    if (acao === "exemplo") {
      var p = Perfis.PERFIS.filter(function (x) { return x.chave === alvo.getAttribute("data-perfil"); })[0];
      visao = { nome: p.nome, dados: Desc.simular(C, D, Calc, Perfis, p) };
      render(); window.scrollTo(0, 0); return;
    }
    if (acao === "inicio") { visao = null; return irPara("abertura"); }
    if (acao === "refazer") { estado = novoEstado(); salvar(); return irPara("abertura"); }
    if (acao === "maestria") { var n = document.getElementById("nota-maestria"); if (n) n.hidden = false; return; }
    if (acao === "racional-desligar") { racionalLigado = false; gravarRacional(false); return render(); }

    if (acao === "ocupacao") { estado.ocupacao = valor; if (valor !== "negocio") estado.tipoNegocio = null; if (valor !== "colaborador") estado.lidera = null; salvar(); return render(); }
    if (acao === "tipo") { estado.tipoNegocio = valor; salvar(); return render(); }
    if (acao === "lidera") { estado.lidera = valor === "sim"; salvar(); return render(); }
    if (acao === "filhos") { estado.filhos = valor === "sim"; salvar(); return render(); }
    if (acao === "triagem-ok") return irPara("entrada1");
    if (acao === "comecar-etapa") { var et = alvo.getAttribute("data-etapa"); if (et === "e2" || et === "e3") garantirFilas(); return irPara(et, 0); }
    if (acao === "ir-entrada2") return irPara("entrada2");
    if (acao === "ir-entrada3") return irPara("entrada3");
    if (acao === "ir-pedido3") return irPara("pedido3");
    if (acao === "ir-entrada4") return irPara("entrada4");
    if (acao === "idade") { estado.idade = valor; salvar(); return render(); }
    if (acao === "sexo") { estado.sexo = valor; salvar(); return render(); }

    if (acao === "avancar") {
      var lista = listaAtual();
      if (estado.i + 1 < lista.length) return irPara(estado.etapa, estado.i + 1);
      if (estado.etapa === "e1") { estado.principalE1 = apurarE1(estado).principal; estado.filaE2 = []; estado.filaE3 = []; garantirFilas(); return irPara("entrega1"); }
      return irPara("entrega4");
    }
    if (acao === "voltar") {
      if (estado.etapa === "triagem") return irPara("abertura");
      if (estado.etapa === "entrada1") return irPara("triagem");
      if (estado.etapa === "e1") return estado.i > 0 ? irPara("e1", estado.i - 1) : irPara("entrada1");
      if (estado.etapa === "entrada2") return irPara("entrega1");
      if (estado.etapa === "e2") return estado.i > 0 ? irPara("e2", estado.i - 1) : irPara("entrada2");
      if (estado.etapa === "entrada3") return irPara("entrega2");
      if (estado.etapa === "e3") return estado.i > 0 ? irPara("e3", estado.i - 1) : irPara("entrada3");
      if (estado.etapa === "pedido2") return irPara("e3", estado.filaE3.length - 1);
      if (estado.etapa === "pedido3") return irPara("entrega3");
      if (estado.etapa === "entrada4") return irPara("pedido3");
      if (estado.etapa === "e4") return estado.i > 0 ? irPara("e4", estado.i - 1) : irPara("entrada4");
      return irPara("abertura");
    }
    if (acao === "ordenar") {
      var s = listaAtual()[estado.i], e = alvo.getAttribute("data-emocao");
      var ordem = (estado.ordens[s.id] || []).slice(), pos = ordem.indexOf(e);
      if (pos >= 0) ordem = ordem.slice(0, pos);
      else { ordem.push(e); if (ordem.length === 3) ordem.push(ORDEM.filter(function (x) { return ordem.indexOf(x) === -1; })[0]); }
      estado.ordens[s.id] = ordem;
      salvar(); render(); return;
    }
    if (acao === "refazer-ordem") { estado.ordens[listaAtual()[estado.i].id] = []; salvar(); render(); return; }
    if (acao === "responder") {
      var fila = filaAtual(), id = fila[estado.i];
      estado.respostas[id] = Number(valor);
      salvar(); render();
      setTimeout(function () {
        if (fila[estado.i] !== id) return;
        if (estado.i + 1 < fila.length) return irPara(estado.etapa, estado.i + 1);
        irPara(estado.etapa === "e2" ? "entrega2" : "pedido2");
      }, 350);
    }
  });

  function iniciar(dados) {
    estado = (dados && versaoAtual(dados.estado)) ? dados.estado : (carregar() || novoEstado());
    if (estado.tipoNegocio === undefined) { estado.tipoNegocio = null; estado.lidera = null; estado.filhos = null; }
    visao = (dados && dados.visao) || null;
    racionalLigado = lerRacional();
    render();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { estado: estado, visao: visao }; });
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(iniciar);
  else iniciar((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
</body>
</html>
