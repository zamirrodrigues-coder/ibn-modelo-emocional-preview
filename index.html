<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}</style>
<title>Modelo Emocional Descoberta</title>
<meta name="description" content="Protótipo v2 do teste Modelo Emocional no Modo Descoberta, para locais parceiros, versão f1.3-descoberta-r12.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:wght@400&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: coluna única de leitura de 640px; cartão só onde há escolha a fazer.
   Cores e fontes seguem as páginas de teste do app do IBN; a Roda usa as cores
   da Roda da Harmonização das Emoções do Empower. */
:root {
  --bg: #F5F4F1;
  --surface: #FDFCFA;
  --ink: #141410;
  --muted: #5A5A6A;
  --line: #E6E5DF;
  --grid: #DAD8D0;
  --accent: #5C35CC;
  --accent-ink: #FFFFFF;
  --accent-soft: #EEEEFF;
  --warn-bg: #FFF3D1;
  --warn-ink: #5C4400;
  --t: #C2D46B; --t-ink: #262C0B;
  --m: #8DBEDD; --m-ink: #0E2535;
  --a: #F2DC6D; --a-ink: #3B2F05;
  --r: #D9474B; --r-ink: #FFFFFF;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  --raio: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131315; --surface: #1C1C20; --ink: #EDECE7; --muted: #A6A5B2; --line: #2D2D34; --grid: #34343C;
    --accent: #A08BF2; --accent-ink: #131315; --accent-soft: #272240;
    --warn-bg: #3A2F10; --warn-ink: #F3DC9A;
    --t: #A7BA4F; --t-ink: #171A08; --m: #6EA4CA; --m-ink: #08151F; --a: #D8C150; --a-ink: #241C02; --r: #C9434A; --r-ink: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131315; --surface: #1C1C20; --ink: #EDECE7; --muted: #A6A5B2; --line: #2D2D34; --grid: #34343C;
  --accent: #A08BF2; --accent-ink: #131315; --accent-soft: #272240;
  --warn-bg: #3A2F10; --warn-ink: #F3DC9A;
  --t: #A7BA4F; --t-ink: #171A08; --m: #6EA4CA; --m-ink: #08151F; --a: #D8C150; --a-ink: #241C02; --r: #C9434A; --r-ink: #FFFFFF;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 0 48px;
}
#app { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 2.6rem; }
h2 { font-size: 1.7rem; }
h3 { font-family: var(--font-body); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; max-width: 62ch; }
.pilha { display: flex; flex-direction: column; gap: 16px; }
.pilha-larga { display: flex; flex-direction: column; gap: 28px; }

/* Topo com progresso */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: 8px;
}
.topo-linha { display: flex; justify-content: space-between; gap: 12px; font-size: 0.85rem; color: var(--muted); }
.topo-linha strong { color: var(--ink); font-weight: 600; }
.progresso { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progresso span { display: block; height: 100%; background: var(--accent); transition: width 200ms ease; }

/* Botões */
button { font: inherit; color: inherit; cursor: pointer; }
.botao {
  min-height: 48px; padding: 12px 20px; border-radius: 10px; border: 1px solid transparent;
  font-weight: 600; font-size: 1rem;
}
.botao-primario { background: var(--accent); color: var(--accent-ink); }
.botao-secundario { background: transparent; color: var(--ink); border-color: var(--line); }
.botao-texto { background: none; border: none; color: var(--accent); font-weight: 600; padding: 8px 0; min-height: 40px; }
.botao:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.acoes { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.acoes-fim { justify-content: space-between; }

/* Início */
.selo {
  align-self: flex-start; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px;
}
.inicio { padding-block: 32px 0; }
.subtitulo { font-size: 1.15rem; color: var(--muted); }
.nota { font-size: 0.85rem; color: var(--muted); }
.legal { border-left: 3px solid var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; color: var(--muted); }
.exemplos { border-top: 1px solid var(--line); padding-top: 24px; }
.grade-exemplos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grade-exemplos .botao { width: 100%; }
.confirma { background: var(--warn-bg); color: var(--warn-ink); padding: 14px; border-radius: var(--raio); display: flex; flex-direction: column; gap: 12px; }

/* Situações */
.etapa { padding-block: 24px 0; }
.eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.cena { font-family: var(--font-display); font-size: 1.65rem; line-height: 1.25; font-weight: 500; }
.pergunta { font-weight: 600; }
.dica { font-size: 0.9rem; color: var(--muted); }
.opcoes { display: flex; flex-direction: column; gap: 10px; }
.opcao {
  display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
  padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio);
  font-size: 1rem; line-height: 1.45; min-height: 56px;
}
.opcao .rank {
  flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1.5px dashed var(--grid);
  display: grid; place-items: center; font-weight: 600; font-size: 0.9rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.opcao[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opcao[aria-pressed="true"] .rank { background: var(--accent); color: var(--accent-ink); border: none; }
.opcao span:last-child { min-width: 0; padding-top: 4px; }

/* Afirmações */
.afirmacao { font-family: var(--font-display); font-size: 1.75rem; line-height: 1.25; font-weight: 500; min-height: 4.5em; }
.escala { display: flex; flex-direction: column; gap: 8px; }
.escala button {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  min-height: 50px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: 1rem; text-align: left;
}
.escala button .valor { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.escala button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.escala button[aria-pressed="true"] .valor { color: var(--accent-ink); }

/* Resultado */
.resultado { padding-block: 32px 0; }
.bloco { display: flex; flex-direction: column; gap: 14px; padding-block: 28px; border-top: 1px solid var(--line); }
.bloco:first-of-type { border-top: none; padding-top: 8px; }
.sintese { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.2; font-weight: 600; text-wrap: balance; }
.aviso { background: var(--warn-bg); color: var(--warn-ink); padding: 14px 16px; border-radius: var(--raio); font-size: 0.95rem; }
.marca-exemplo { align-self: flex-start; font-size: 0.8rem; font-weight: 600; color: var(--warn-ink); background: var(--warn-bg); padding: 4px 10px; border-radius: 999px; }

.roda-caixa { display: flex; justify-content: center; }
.roda { width: 100%; max-width: 440px; height: auto; }
.roda text { font-family: var(--font-body); }
.legenda { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.legenda-item { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--raio); background: var(--surface); min-width: 0; }
.legenda-cabeca { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.legenda-cabeca strong { font-size: 1rem; }
.chip { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip-T { background: var(--t); color: var(--t-ink); }
.chip-M { background: var(--m); color: var(--m-ink); }
.chip-A { background: var(--a); color: var(--a-ink); }
.chip-R { background: var(--r); color: var(--r-ink); }
.faixa { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.valores { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.textos-faixa { display: flex; flex-direction: column; gap: 10px; }
.textos-faixa p { font-size: 0.95rem; }

.fluxo-linhas { display: flex; flex-direction: column; gap: 10px; }
.fluxo-rotulo { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.fluxo-linha { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.passo-fluxo { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; min-width: 0; }
.passo-fluxo b { font-size: 0.95rem; }
.passo-fluxo small { font-size: 0.75rem; opacity: 0.85; overflow-wrap: anywhere; }
.passo-T { background: var(--t); color: var(--t-ink); }
.passo-M { background: var(--m); color: var(--m-ink); }
.passo-A { background: var(--a); color: var(--a-ink); }
.passo-R { background: var(--r); color: var(--r-ink); }
.indice { display: flex; flex-direction: column; gap: 8px; }
.indice-numero { font-family: var(--font-body); font-size: 2.4rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.indice-numero small { font-family: var(--font-body); font-size: 0.9rem; color: var(--muted); font-weight: 500; }
.regua { position: relative; height: 10px; border-radius: 6px; background: var(--line); }
.regua .trecho { position: absolute; top: 0; bottom: 0; }
.regua .marcador { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: var(--accent); transform: translateX(-2px); }
.regua-legenda { position: relative; height: 18px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.regua-legenda span { position: absolute; transform: translateX(-50%); }

.passo-titulo { font-weight: 600; color: var(--accent); }
ul.gatilhos { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

details.calculo { border: 1px dashed var(--grid); border-radius: var(--raio); padding: 12px 14px; }
details.calculo summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.tabela-caixa { overflow-x: auto; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
.calculo-texto { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--muted); }

@media (max-width: 420px) {
  h1 { font-size: 2.2rem; }
  .cena, .afirmacao { font-size: 1.45rem; }
  .sintese { font-size: 1.6rem; }
  .legenda, .grade-exemplos { grid-template-columns: minmax(0, 1fr); }
  .fluxo-linha { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Roda da Harmonização das Emoções */
.roda .fundo { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.roda .grade { fill: none; stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 4; }
.roda .anel { fill: var(--line); }
.roda .rotulo { fill: var(--ink); font-size: 11.5px; font-weight: 500; }
.roda .texto-banda { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; }
.roda .banda-T, .roda .w-T { fill: var(--t); }
.roda .banda-M, .roda .w-M { fill: var(--m); }
.roda .banda-A, .roda .w-A { fill: var(--a); }
.roda .banda-R, .roda .w-R { fill: var(--r); }
.roda .texto-banda-T { fill: var(--t-ink); }
.roda .texto-banda-M { fill: var(--m-ink); }
.roda .texto-banda-A { fill: var(--a-ink); }
.roda .texto-banda-R { fill: var(--r-ink); }
.roda .valor-fatia { fill: var(--ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.roda .cubo { fill: var(--ink); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* Modo Descoberta (v2) */
.chamada-qr { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px dashed var(--grid); border-radius: var(--raio); font-family: var(--font-display); font-size: 1.25rem; line-height: 1.3; }
.chamada-qr .eyebrow { font-family: var(--font-body); font-size: 0.72rem; }
.topo .progresso { margin-top: 2px; }
.prompt { font-weight: 600; font-size: 1.05rem; color: var(--accent); }
.como { gap: 10px; }
.passos { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.passos li { padding-left: 4px; }
.orientacao { font-weight: 500; }
.opcao[aria-pressed="true"] .rank.rank-auto { background: var(--accent-soft); color: var(--accent); }

/* Tela inicial no layout do mockup do Zamir (06/10). Medidas tiradas do mockup a 390 px. */
:root {
  --ab-suave: #46475D; --ab-placeholder: #7C7C8E; --ab-borda: #D3D1CD; --ab-divisor: #E0DEDA;
  --ab-fundo-1: #FAF8F4; --ab-fundo-2: #F7F6F2; --ab-fundo-3: #F1EFEA;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ab-suave: #B8B7CB; --ab-placeholder: #8E8DA0; --ab-borda: #3A3A43; --ab-divisor: #2D2D34; --ab-fundo-1: #19191C; --ab-fundo-2: #151517; --ab-fundo-3: #111113; }
}
:root[data-theme="dark"] { --ab-suave: #B8B7CB; --ab-placeholder: #8E8DA0; --ab-borda: #3A3A43; --ab-divisor: #2D2D34; --ab-fundo-1: #19191C; --ab-fundo-2: #151517; --ab-fundo-3: #111113; }
body.tela-abertura { background-color: var(--ab-fundo-2); background-image: linear-gradient(168deg, var(--ab-fundo-1) 0%, var(--ab-fundo-2) 52%, var(--ab-fundo-3) 100%); background-repeat: no-repeat; min-height: 100%; }
.abertura { display: flex; flex-direction: column; padding: 50px 18px 0; min-height: 100vh; min-height: 100svh; box-sizing: border-box; }
.abertura-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ab-suave); margin: 0; }
.abertura-titulo { font-family: "EB Garamond", var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 8.9vw, 2.6rem); letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); margin: 23px 0 0; text-wrap: wrap; }
.abertura-apoio { font-size: 15.5px; font-weight: 300; line-height: 1.4; color: var(--ab-suave); margin: 14px 0 0; max-width: none; }
.abertura-form { display: flex; flex-direction: column; margin: 42px 0 0; }
.abertura-acao { margin: 42px 0 0; }
.abertura-pergunta { font-size: 18px; font-weight: 600; color: var(--ink); margin: 0; }
.abertura-rotulo { font-size: 13px; font-weight: 600; color: var(--ab-suave); margin: 12px 0 0; }
.abertura-campo { font: inherit; font-size: 15.5px; height: 46px; box-sizing: border-box; width: 100%; margin: 7px 0 0; padding: 0 16px; border: 1px solid var(--ab-borda); border-radius: 10px; background: var(--surface); color: var(--ink); }
.abertura-campo::placeholder { color: var(--ab-placeholder); opacity: 1; }
.abertura-campo:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.abertura-ajuda { font-size: 13px; font-weight: 300; color: var(--ab-suave); margin: 8px 0 0; }
.abertura-botao { align-self: flex-start; min-width: 171px; height: 50px; margin: 24px 0 0; border-radius: 10px; font-size: 16px; }
.abertura-legal { margin: 30px 0 0; padding-left: 15px; border-left: 2px solid var(--ab-borda); display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 300; line-height: 1.4; color: var(--ab-suave); }
.abertura-assinatura { margin: 18px -12px 0; padding: 9px 0 12px; border-top: 1px solid var(--ab-divisor); display: flex; flex-direction: column; align-items: center; gap: 5px; }
.abertura-assinatura span { font-size: 8px; line-height: 1; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ab-suave); opacity: 0.85; }
.assinatura-simbolo { width: 16px; height: auto; }
.assinatura-marca { width: 45px; height: auto; margin-top: 1px; }
details.ferramentas { margin: 24px 0 0; border-top: 1px dashed var(--grid); padding-top: 14px; color: var(--muted); }
details.ferramentas > summary { cursor: pointer; font-size: 0.85rem; font-weight: 600; }
details.ferramentas > div { margin-top: 18px; }

/* Modo de validação: racional por pergunta e resposta (só no protótipo) */
.validacao { border-top: 1px solid var(--line); padding-top: 24px; }
.cena-linha { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.cena-linha > p { flex: 1 1 240px; }
.opcao-linha { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.opcao-linha .opcao { flex: 1 1 240px; }
details.racional { display: contents; }
details.racional > summary {
  list-style: none; flex: none; width: 30px; height: 30px; border-radius: 50%; margin-top: 4px;
  border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface);
  display: grid; place-items: center; font-weight: 700; cursor: pointer;
}
details.racional > summary::-webkit-details-marker { display: none; }
details.racional[open] > summary { background: var(--accent); color: var(--accent-ink); }
.racional-painel { flex-basis: 100%; background: var(--accent-soft); border-radius: var(--raio); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
.racional-painel p { max-width: none; }
.aviso-validacao { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--warn-ink); background: var(--warn-bg); padding: 2px 10px; border-radius: 8px; }
.aviso-validacao .botao-texto { color: var(--warn-ink); min-height: 32px; padding: 4px 0; font-size: 0.8rem; }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo span { font-size: 0.85rem; font-weight: 600; }
.campo input { font: inherit; font-size: 1.05rem; min-height: 50px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box; }
.campo input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.marcar { display: flex; gap: 10px; align-items: flex-start; font-size: 0.95rem; }
.marcar input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--accent); }
.erro { color: var(--r); font-size: 0.9rem; }
.escolhas { display: flex; flex-direction: column; gap: 8px; }
.escolhas button { min-height: 50px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1rem; text-align: left; }
.escolhas button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.escolhas-linha { flex-direction: row; flex-wrap: wrap; }
.escolhas-linha button { flex: 1 1 calc(50% - 8px); text-align: center; }
.convite { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--raio); background: var(--accent-soft); margin-top: 8px; }
.convite p { font-weight: 500; }
.convite .botao { align-self: flex-start; }
.parar { font-size: 0.9rem; color: var(--muted); }

</style>
</head>

oda e alegria usada como máscara.","facetas":[{"codigo":"E-L","nome":"Euforia que ignora limites","descricao":"Assumir, começar e decidir no calor da animação."},{"codigo":"E-P","nome":"Prazer em excesso como fuga","descricao":"Gastar, buscar novidade e estímulo para esquecer o que incomoda."},{"codigo":"E-M","nome":"Máscaras","descricao":"Mostrar uma alegria que esconde o que sente."}],"fora":"Decidir no calor da irritação fica em Impulsividade."},{"codigo":"IM","emocao":"R","lado":"positivo","nome":"Impulsionamento","definicao":"Usar a raiva como energia para realizar, enfrentar obstáculos e mudar a situação, acionada de propósito e na medida certa.","facetas":[{"codigo":"I-E","nome":"Energia para realizar","descricao":"Terminar o que começou quando a motivação acaba."},{"codigo":"I-O","nome":"Enfrentar obstáculos e injustiças","descricao":"Insistir, defender o que é justo e mudar a situação."},{"codigo":"I-U","nome":"Uso consciente","descricao":"Escolher o momento e acionar a firmeza com postura e voz."}],"fora":"Entusiasmo que contagia fica em Motivação."},{"codigo":"IP","emocao":"R","lado":"negativo","nome":"Impulsividade","definicao":"Usar a raiva no impulso, contra os outros ou contra si.","facetas":[{"codigo":"R-I","nome":"Agir e falar no impulso","descricao":"Falar e decidir antes da escolha."},{"codigo":"R-O","nome":"Contra os outros","descricao":"Levantar a voz, romper relações, guardar ressentimento."},{"codigo":"R-S","nome":"Contra si","descricao":"Cobrança dura e castigo voltados para si."}],"fora":"Animação que passa na frente do plano fica em Euforia."}],"situacoes":[{"id":"S01","contexto":"trabalho","cena":"Sua empresa anuncia uma reestruturação, e a sua área vai mudar de gestor e de rotina.","reacoes":{"T":"Sinto falta do jeito antigo e preciso de um tempo para assimilar.","M":"Fico em alerta com o que pode mudar para mim.","A":"Me animo com a chance de começar algo novo.","R":"Sinto uma força que me empurra a me posicionar logo."}},{"id":"S02","co ntexto":"vida pessoal","sombra":false},{"id":"IM3","celula":"IM","faceta":"I-E","texto":"Quando alguém duvida de mim, transformo isso em vontade de entregar.","par":null,"contexto":"trabalho","sombra":false},{"id":"IM4","celula":"IM","faceta":"I-O","texto":"Quando algo me frustra, insisto até encontrar uma saída.","par":null,"contexto":"decisão","sombra":false},{"id":"IM5","celula":"IM","faceta":"I-O","texto":"Defendo com firmeza o que considero justo, sem ofender ninguém.","par":null,"contexto":"relação","sombra":false},{"id":"IM6","celula":"IM","faceta":"I-E","texto":"Quando o time trava, assumo a frente e coloco as coisas em movimento.","par":null,"contexto":"trabalho","sombra":false},{"id":"IM7","celula":"IM","faceta":"I-U","texto":"Quando preciso de força para agir, mudo a postura e falo com firmeza.","par":null,"contexto":"decisão","sombra":false},{"id":"IM8","celula":"IM","faceta":"I-U","texto":"Escolho o momento certo para usar minha firmeza.","par":null,"contexto":"relação","sombra":false},{"id":"IP1","celula":"IP","faceta":"R-I","texto":"Falo coisas de que me arrependo quando estou com raiva.","par":"B","contexto":"relação","sombra":true},{"id":"IP2","celula":"IP","faceta":"R-I","texto":"Na hora da raiva, digo o que depois preferia ter guardado.","par":"B","contexto":"relação","sombra":true},{"id":"IP3","celula":"IP","faceta":"R-I","texto":"Tomo decisões importantes no calor da irritação.","par":null,"contexto":"decisão","sombra":true},{"id":"IP4","celula":"IP","faceta":"R-O","texto":"Levanto a voz quando alguém me contraria.","par":null,"contexto":"relação","sombra":true},{"id":"IP5","celula":"IP","faceta":"R-O","texto":"Corto relações de uma vez quando sinto desrespeito.","par":null,"contexto":"relação","sombra":true},{"id":"IP6","celula":"IP","faceta":"R-O","texto":"Guardo raiva de uma pessoa por muito tempo.","par":null,"contexto":"relação","sombra":true},{"id":"IP7","celula":"IP","faceta":"R-S","texto":"Quando erro, falo comigo de um jeito duro e agressivo.","par":null,"contexto":"vida pessoal","sombra":true},{"id":"IP8","celula":"IP","faceta":"R-S","texto":"Quando a raiva vem, eu me castigo em vez de resolver a situação.","par":null,"contexto":"vida pessoal","sombra":true}],"escala":["Nunca","Raramente","Às vezes","Com frequência","Quase sempre","Sempre"],"retratos":{"T":{"sintese":"A tristeza é a primeira emoção do fluxo perfeito. Quando ela vem primeiro em você, a sua tendência é parar e sentir o peso do que mudou antes de agir.","sinal_corpo":"Peso no peito, garganta apertada e vontade de silêncio.","gatilhos":["Perdas e despedidas","Rejeição","Fim de um ciclo","Expectativa frustrada"],"o_que_da":"No lado positivo, a tristeza te dá humildade. Você para antes dos outros, sente o tamanho do que mudou e admite o que ainda falta aprender. É essa pausa que faz você ouvir quem viu a cena de fora e enxergar o que antes passava despercebido. Para quem olha de fora, pode parecer lentidão, e é o contrário: quem processa a perda com honestidade volta ao movimento mais leve, com menos mágoa guardada e mais empatia por quem passa pelo mesmo.","o_que_custa":"No lado negativo, a tristeza vira vitimização. A pausa que deveria ser curta se estende, e a história passa a girar em torno do que fizeram com você. A energia para agir vai embora, e cada nova frustração confirma a sensação de que a vida pesa mais do seu lado. O custo aparece nos planos parados e nas relações cansadas de ouvir a mesma queixa. A virada começa quando você percebe que a pausa já cumpriu a função dela.","como_lidar":"Com quem reage primeiro pela tristeza, ofereça tempo antes de pedir uma decisão. Ouça a perda sem apressar a solução. Depois, pergunte o que essa pessoa aprendeu e qual é o próximo passo dela."},"M":{"sintese":"O medo é a segunda emoção do fluxo perfeito. Quando ele vem primeiro em você, a sua tendência é enxergar o risco antes de qualquer outra coisa.","sinal_corpo":"Coração acelerado, frio na barriga, respiração curta e atenção presa no que pode dar errado.","gatilhos":["Mudanças","Exposição e avaliação","Decisões sem garantia","Situações novas"],"o_que_da":"No lado positivo, o medo te faz planejar. Você enxerga o risco que os outros deixam passar e transforma esse alerta em preparo: lista o que pode dar errado, divide o caminho em passos e protege o que importa para você. Quem convive com você sabe que um projeto passa mais seguro pelas suas mãos. E o medo bem usado te dá mais coragem do que parece, porque você entra nas situações sabendo o que fazer quando o plano mudar.","o_que_custa":"No lado negativo, o medo gera fuga e congelamento. O alerta, que deveria virar plano, vira um ciclo de ensaiar o pior cenário. Você adia a decisão, evita a conversa que precisa acontecer e recusa oportunidades para não se expor. Por fora, isso parece prudência. Por dentro, o preço é alto: o tempo passa, a situação cresce e a sensação de controle diminui. A virada começa quando você troca a pergunta 'e se der errado?' por 'qual é o primeiro passo?'.","como_lidar":"Com quem reage primeiro pelo medo, mostre o plano antes de pedir a decisão. Diga quais riscos já foram pensados e combine o primeiro passo com data. A segurança vem do concreto, e a pressa aumenta o alerta."},"A":{"sintese":"A alegria é a terceira emoção do fluxo perfeito. Quando ela vem primeiro em você, a sua tendência é enxergar a possibilidade e se animar antes de medir o caminho.","sinal_corpo":"Leveza no corpo, sorriso fácil e energia para conversar e começar algo novo.","gatilhos":["Conquistas","Novidades","Reconhecimento","Encontros com pessoas"],"o_que_da":"No lado positivo, a alegria te dá o motivo para agir. Depois do plano feito, é ela que transforma intenção em movimento: você imagina o resultado pronto, encontra o porquê e contagia quem está por perto. Você celebra as pequenas vitórias e, com isso, mantém a energia do time viva durante os projetos longos. O que pouca gente percebe é que a sua leveza funciona como disciplina, porque faz você voltar ao trabalho com vontade, dia após dia.","o_que_custa":"No lado negativo, a alegria em excesso vira euforia. No calor da animação, você assume compromissos sem medir o tempo, começa vários projetos, termina poucos e gasta além do planejado. Às vezes a alegria vira máscara, e o sorriso aparece para esconder o que você sente por dentro. O custo chega depois, na conta, na agenda ou na relação que pedia mais verdade. A virada começa quando a alegria vem depois do plano, e não no lugar dele.","como_lidar":"Com quem reage primeiro pela alegria, aproveite a energia e traga o plano para perto. Celebre a ideia, peça os próximos passos por escrito e combine pontos de checagem. A animação rende mais quando tem um trilho."},"R":{"sintese":"A raiva é a quarta emoção do fluxo perfeito, a que entra quando a motivação já se esgotou. Quando ela vem primeiro em você, a sua tendência é partir para a ação na hora.","sinal_corpo":"Calor no rosto, mandíbula tensa, mãos fechadas e uma energia que pede ação imediata.","gatilhos":["Injustiça","Desrespeito","Obstáculos no caminho","Promessas quebradas"],"o_que_da":"No lado positivo, a raiva impulsiona. É a energia que tira você da inércia quando a motivação acaba, que dá força para enfrentar um obstáculo e para defender o que é justo. Você termina o que começou mesmo depois que o entusiasmo passou. O que diferencia o impulsionamento é a direção: você escolhe o momento, ajusta a postura, firma a voz e coloca a força na situação, e não na pessoa.","o_que_custa":"No lado negativo, a raiva vira impulsividade. A energia sai antes da escolha: você fala o que depois preferia ter guardado, decide no calor da irritação ou corta uma relação de uma vez. Às vezes ela se volta para dentro, em forma de cobrança dura consigo. O custo aparece nas pontes queimadas e no cansaço de reparar o que foi dito. A virada começa quando você percebe o calor subir e ganha alguns segundos antes de responder.","como_lidar":"Com quem reage primeiro pela raiva, reconheça a urgência e dê uma tarefa para a energia. Combine um tempo curto antes de discutir e volte ao assunto com fatos. Respeito e clareza baixam a temperatura mais rápido que argumentos."}},"passos":[{"numero":1,"nome":"Percepção","texto":"Perceber a emoção na origem, antes que ela cresça. Note o sinal no corpo, note a vontade que ele desperta e pergunte a si: por que eu quero fazer isso?","porque":"A sua emoção principal está mais no lado negativo, ou aparece pouco no dia a dia. O primeiro ganho é percebê-la mais cedo."},{"numero":2,"nome":"Compreensão","texto":"Olhar a cena de fora, aceitar o que sente e descobrir qual emoção está presente, se ela atua no positivo ou no negativo e qual delas virou o seu ponto de partida automático.","porque":"A sua emoção principal está em transição. O ganho agora é entender em que momentos ela atua no positivo e em quais ela pesa."},{"numero":3,"nome":"Controle","texto":"Usar a linguagem para mudar o que sente. Diga o que você quer, e não o que você evita. Quando a linguagem muda, a emoção e a ação mudam junto.","porque":"A sua emoção principal atua no positivo, e a ordem das suas emoções ainda se afasta do fluxo perfeito. A linguagem é a ferramenta para reorganizar essa ordem."},{"numero":4,"nome":"Gerenciamento","texto":"Gerar de propósito a emoção que a situação pede, com palavras, postura e tom de voz. É usar cada emoção no lugar dela no fluxo: humildade, plano, motivação e impulso.","porque":"A sua emoção principal atua no positivo, e a sua ordem está perto do fluxo perfeito. O próximo nível é usar cada emoção de propósito."}],"acoes":{"T":{"1":"Durante 30 dias, sempre que sentir um aperto ou um peso, anote em uma frase o que aconteceu logo antes. Releia as anotações no fim de cada semana.","2":"Escolha uma perda recente e escreva duas listas: o que ela levou e o que ela te ensinou. Converse sobre a segunda lista com alguém de confiança nesta semana.","3":"Quando a tristeza vier, troque 'por que isso aconteceu comigo?' por 'o que eu aprendo com isso?'. Faça essa troca em voz alta durante 30 dias.","4":"Antes de cada decisão importante deste mês, reserve dez minutos para perguntar a alguém o que você deixou passar. É a humildade usada de propósito."},"M":{"1":"Durante 30 dias, sempre que o coração acelerar ou a barriga gelar, anote o que estava em jogo naquele momento. Revise as anotações no fim de cada semana.","2":"Escolha uma decisão que você vem adiando e escreva o que exatamente te assusta nela. Separe o risco real do cenário imaginado e mostre a lista a alguém de confiança.","3":"Troque 'e se der errado?' por 'qual é o primeiro passo?'. Durante 30 dias, responda a essa pergunta em voz alta antes de cada decisão importante.","4":"Nas próximas quatro semanas, antes de cada decisão grande, monte um plano de uma página com riscos, cuidados e o primeiro passo com data."},"A":{"1":"Durante 30 dias, perceba os momentos de animação forte e anote o que você prometeu ou comprou logo depois. No fim de cada semana, confira o que manteve.","2":"Escolha um compromisso que você assumiu no calor da empolgação e confira se ele combina com o seu plano. Até o fim da semana, mantenha, ajuste ou renegocie.","3":"Quando a empolgação vier, diga em voz alta o plano antes da promessa, por exemplo: 'primeiro eu confirmo a agenda, depois eu aceito'. Pratique por 30 dias.","4":"Use a alegria de propósito. Ao terminar cada etapa de um projeto deste mês, celebre com quem participou e anuncie o próximo passo na mesma conversa."},"R":{"1":"Durante 30 dias, perceba o primeiro sinal da raiva no corpo, como o calor no rosto ou a mandíbula tensa, e conte até dez antes de responder.","2":"Escolha uma situação recente em que a raiva falou primeiro. Escreva o que ela queria proteger e qual seria uma resposta firme e justa para a mesma cena.","3":"Quando a raiva subir, diga em uma frase o que você quer antes de qualquer outra coisa, por exemplo: 'eu quero que o prazo seja respeitado'. Pratique por 30 dias.","4":"Guarde a raiva para quando a motivação acabar. Neste mês, use a postura firme e a voz decidida de propósito para terminar uma tarefa que ficou parada."}},"faixas_lado_nomes":{"positivo":"Atua no Positivo","transicao":"Em Transição","negativo":"Atua no Negativo","pouca":"Pouco Acionada"},"faixas_lado":{"T":{"positivo":"Hoje a sua tristeza atua no positivo. Ela vira humildade, empatia e espaço para aprender com o que mudou.","transicao":"Hoje a sua tristeza está em transição. Ela abre espaço para aprender e, em alguns momentos, ainda pesa mais do que ensina.","negativo":"Hoje a sua tristeza atua no negativo. Ela tem levado mais à vitimização e à falta de energia para agir do que à humildade.","pouca":"Hoje a tristeza aparece pouco no seu dia a dia. Observe se as perdas recebem o tempo de que precisam."},"M":{"positivo":"Hoje o seu medo atua no positivo. Ele vira planejamento, prevenção e cuidado com o que importa para você.","transicao":"Hoje o seu medo está em transição. Em parte ele vira plano e, em parte, ainda segura decisões que poderiam andar.","negativo":"Hoje o seu medo atua no negativo. Ele tem gerado mais fuga e congelamento do que planejamento.","pouca":"Hoje o medo aparece pouco no seu dia a dia. Observe se os riscos das suas decisões recebem a atenção que merecem."},"A":{"positivo":"Hoje a sua alegria atua no positivo. Ela vira motivação, entusiasmo e celebração do que você conquista.","transicao":"Hoje a sua alegria está em transição. Ela move os seus planos e, em alguns momentos, ainda passa na frente deles.","negativo":"Hoje a sua alegria atua no negativo. Ela tem aparecido mais como euforia ou como máscara do que como motivação.","pouca":"Hoje a alegria aparece pouco no seu dia a dia. Observe se as suas conquistas recebem a celebração que merecem."},"R":{"positivo":"Hoje a sua raiva atua no positivo. Ela vira impulso para realizar, enfrentar obstáculos e terminar o que você começa.","transicao":"Hoje a sua raiva está em transição. Ela impulsiona as suas entregas e, em alguns momentos, ainda sai antes da escolha.","negativo":"Hoje a sua raiva atua no negativo. Ela tem saído mais como impulsividade, contra os outros ou contra você, do que como impulso.","pouca":"Hoje a raiva aparece pouco no seu dia a dia. Observe se a força chega quando a motivação acaba."}},"faixas_fluxo":[{"chave":"perto","nome":"Perto do Fluxo Perfeito","regua":"70 ou mais","texto":"A ordem em que você aciona as emoções está perto do fluxo perfeito: primeiro a humildade, depois o plano, a motivação e, quando precisa, o impulso."},{"chave":"ajuste","nome":"Fluxo em Ajuste","regua":"de 40 a 69","texto":"Parte das suas reações segue o fluxo perfeito, e parte troca a ordem das emoções. O ganho está em perceber em quais situações a ordem muda."},{"chave":"invertido","nome":"Fluxo Invertido","regua":"abaixo de 40","texto":"Na maior parte das situações, as suas emoções aparecem na ordem contrária ao fluxo perfeito, com o impulso e a animação chegando antes da humildade e do plano. É esse fluxo que o Maestria Emocional trabalha."}],"frases_sintese":{"T":{"positivo":"A tristeza é a emoção que te move primeiro, e hoje ela vira humildade para aprender com o que muda.","transicao":"A tristeza é a emoção que te move primeiro, e hoje ela alterna entre ensinar e pesar.","negativo":"A tristeza é a emoção que te move primeiro, e hoje ela pesa mais do que ensina."},"M":{"positivo":"O medo é a emoção que te move primeiro, e hoje ele vira plano e cuidado com o que importa.","transicao":"O medo é a emoção que te move primeiro, e hoje ele alterna entre planejar e travar.","negativo":"O medo é a emoção que te move primeiro, e hoje ele trava mais do que protege."},"A":{"positivo":"A alegria é a emoção que te move primeiro, e hoje ela vira motivação para fazer o plano acontecer.","transicao":"A alegria é a emoção que te move primeiro, e hoje ela alterna entre motivar e passar na frente do plano.","negativo":"A alegria é a emoção que te move primeiro, e hoje ela corre mais rápido do que os seus planos."},"R":{"positivo":"A raiva é a emoção que te move primeiro, e hoje ela vira força para realizar e terminar o que você começa.","transicao":"A raiva é a emoção que te move primeiro, e hoje ela alterna entre impulsionar e sair antes da escolha.","negativo":"A raiva é a emoção que te move primeiro, e hoje ela sai antes da escolha."}},"modelos":{"sequencia":"A sua sequência é {s1}, {s2}, {s3} e {s4}. O fluxo perfeito é tristeza, medo, alegria e raiva.","grupo_dominante":"{E1} e {e2} dividem o primeiro lugar. Você aciona essas duas emoções com a mesma força, e cada emoção tem o seu lado positivo e o seu ponto de cuidado.","marcada":"{E} veio primeiro em {n} das {total} situações. É um ponto de partida forte e estável em você.","divergencia":"Nas situações do teste, {e1} vem primeiro. Nas últimas semanas, quem mais aparece no seu dia a dia é {e2}. As duas emoções contam a sua história, e esta devolutiva mostra cada uma.","pouca_principal":"{E} aparece primeiro nas situações do teste e, nas últimas semanas, aparece pouco no seu dia a dia.","consistencia":"Algumas respostas se contradizem entre si. Quando quiser um retrato mais fiel, refaça o teste com calma."},"telas":[{"chave":"intro_titulo","tipo":"titulo","texto":"Modelo Emocional"},{"chave":"intro_subtitulo","tipo":"texto","texto":"Descubra qual das quatro emoções te move primeiro e como cada uma está atuando em você hoje."},{"chave":"intro_como_funciona","tipo":"texto","texto":"São duas partes. Na primeira, você ordena as suas reações em dez situações do dia a dia. Na segunda, responde a 48 afirmações sobre as últimas semanas. Leva de 10 a 12 minutos."},{"chave":"intro_salvaguarda","tipo":"texto","texto":"Este teste é uma ferramenta de autoconhecimento e desenvolvimento. Ele mostra como você está hoje, e esse retrato muda com a prática. Ele não substitui uma avaliação psicológica e não serve para decisões de contratação, promoção ou desligamento. Use o resultado com o seu treinador para escolher o próximo passo."},{"chave":"intro_finalidade","tipo":"texto","texto":"As suas respostas servem ao seu autoconhecimento e ao seu desenvolvimento no IBN. Quem enxerga o resultado: você, o seu treinador responsável e a administração da plataforma."},{"chave":"intro_tentativas","tipo":"texto","texto":"Você pode fazer este teste três vezes. Cada resultado fica guardado para você comparar."},{"chave":"botao_comecar","tipo":"botao","texto":"Começar o Teste"},{"chave":"p1_titulo","tipo":"titulo","texto":"Primeira Parte: Situações"},{"chave":"p1_instrucao","tipo":"texto","texto":"Em cada situação, toque na reação que aparece primeiro em você, depois na segunda e depois na terceira. A quarta entra sozinha. Toda ordem é válida. Responda pelo que acontece em você de verdade."},{"chave":"p1_pergunta","tipo":"texto","texto":"O que vem primeiro em você?"},{"chave":"transicao_titulo","tipo":"titulo","texto":"Primeira Parte Concluída"},{"chave":"transicao_texto","tipo":"texto","texto":"Agora vêm 48 afirmações curtas. Pense nas últimas semanas e diga com que frequência você age assim."},{"chave":"botao_continuar","tipo":"botao","texto":"Continuar"},{"chave":"botao_voltar","tipo":"botao","texto":"Voltar"},{"chave":"p2_titulo","tipo":"titulo","texto":"Segunda Parte: Afirmações"},{"chave":"p2_instrucao","tipo":"texto","texto":"Pense nas últimas semanas. Diga com que frequência você age assim, de Nunca a Sempre. Responda pelo que você faz de verdade."},{"chave":"analisando","tipo":"texto","texto":"Calculando o seu resultado."},{"chave":"botao_ver_resultado","tipo":"botao","texto":"Ver Meu Resultado"},{"chave":"dev_titulo","tipo":"titulo","texto":"Seu Modelo Emocional"},{"chave":"dev_roda","tipo":"titulo","texto":"Sua Roda da Harmonização das Emoções"},{"chave":"dev_fluxo","tipo":"titulo","texto":"Seu Fluxo Emocional"},{"chave":"dev_indice_fluxo","tipo":"titulo","texto":"Índice de Fluxo"},{"chave":"dev_lado_positivo","tipo":"titulo","texto":"O Lado Positivo da Tristeza"},{"chave":"dev <script>
/* Cálculo do teste Modelo Emocional, protótipo da F1. Funções puras: o mesmo
   código roda na página e nos testes em Node. */
(function (raiz) {
  "use strict";

  var ORDEM = ["T", "M", "A", "R"];
  // Os 6 pares do fluxo perfeito: o primeiro de cada par vem antes do segundo.
  var PARES = [["T", "M"], ["T", "A"], ["T", "R"], ["M", "A"], ["M", "R"], ["A", "R"]];

  function arred(v, casas) {
    var f = Math.pow(10, casas);
    return Math.round(v * f) / f;
  }

  function media(lista) {
    if (!lista.length) return 0;
    var s = 0;
    for (var i = 0; i < lista.length; i++) s += lista[i];
    return s / lista.length;
  }

  function apurarParte1(situacoes, ordens, reguas) {
    var pontos = { T: 0, M: 0, A: 0, R: 0 };
    var primeiros = { T: 0, M: 0, A: 0, R: 0 };
    var concordantes = 0, pares = 0, n = 0;

    situacoes.forEach(function (s) {
      var ordem = ordens[s.id];
      if (!ordem || ordem.length !== 4) return;
      n++;
      var pos = {};
      ordem.forEach(function (e, i) {
        pontos[e] += reguas.pontos_por_posicao[i];
        pos[e] = i;
      });
      primeiros[ordem[0]] += 1;
      PARES.forEach(function (p) {
        pares++;
        if (pos[p[0]] < pos[p[1]]) concordantes++;
      });
    });

    var porPontos = ORDEM.slice().sort(function (x, y) {
      return pontos[y] - pontos[x] || primeiros[y] - primeiros[x] || ORDEM.indexOf(x) - ORDEM.indexOf(y);
    });
    var lider = pontos[porPontos[0]];
    // Grupo dominante: até N pontos da líder, ordenado por quem veio mais vezes em primeiro.
    var grupo = ORDEM.filter(function (e) { return lider - pontos[e] <= reguas.gap_grupo_dominante; })
      .sort(function (x, y) {
        return primeiros[y] - primeiros[x] || pontos[y] - pontos[x] || ORDEM.indexOf(x) - ORDEM.indexOf(y);
      });
    var resto = porPontos.filter(function (e) { return grupo.indexOf(e) === -1; });
    var sequencia = grupo.concat(resto);

    var minimoMarcada = Math.ceil(reguas.marcada_fracao_minima * n - 1e-9);
    var marcada = null;
    ORDEM.forEach(function (e) { if (n > 0 && primeiros[e] >= minimoMarcada && !marcada) marcada = e; });

    var indice = pares ? Math.round(100 * concordantes / pares) : 0;
    var faixaFluxo = indice >= reguas.fluxo_perto ? "perto" : (indice >= reguas.fluxo_invertido ? "ajuste" : "invertido");

    return {
      situacoes: n, pontos: pontos, primeiros: primeiros, sequencia: sequencia,
      principal: sequencia[0], grupo: grupo, marcada: marcada, minimoMarcada: minimoMarcada,
      concordantes: concordantes, pares: pares, indice: indice, faixaFluxo: faixaFluxo
    };
  }

  function apurarParte2(conteudo, respostas) {
    var r = conteudo.reguas;
    var valores = {};
    conteudo.celulas.forEach(function (c) { valores[c.codigo] = []; });
    conteudo.afirmacoes.forEach(function (a) {
      var v = respostas[a.id];
      if (typeof v === "number") valores[a.celula].push(v);
    });

    var medias = {}, roda = {};
    conteudo.celulas.forEach(function (c) {
      medias[c.codigo] = arred(media(valores[c.codigo]), 2);
      roda[c.codigo] = arred(media(valores[c.codigo]) * 2, 1);
    });

    var porEmocao = {};
    ORDEM.forEach(function (e) {
      var pos = conteudo.celulas.filter(function (c) { return c.emocao === e && c.lado === "positivo"; })[0].codigo;
      var neg = conteudo.celulas.filter(function (c) { return c.emocao === e && c.lado === "negativo"; })[0].codigo;
      var balanco = arred(medias[pos] - medias[neg], 2);
      var presenca = arred(medias[pos] + medias[neg], 2);
      var faixa;
      if (presenca < r.presenca_minima) faixa = "pouca";
      else if (balanco >= r.balanco_positivo) faixa = "positivo";
      else if (balanco <= r.balanco_negativo) faixa = "negativo";
      else faixa = "transicao";
      porEmocao[e] = { celulaPositiva: pos, celulaNegativa: neg, positivo: medias[pos], negativo: medias[neg],
                       balanco: balanco, presenca: presenca, faixa: faixa };
    });

    var grupos = {};
    conteudo.afirmacoes.forEach(function (a) { if (a.par) (grupos[a.par] = grupos[a.par] || []).push(a.id); });
    var diferencas = {};
    Object.keys(grupos).forEach(function (p) {
      var x = respostas[grupos[p][0]], y = respostas[grupos[p][1]];
      diferencas[p] = (typeof x === "number" && typeof y === "number") ? Math.abs(x - y) : null;
    });
    var chaves = Object.keys(diferencas);
    var aviso = chaves.length > 0 && chaves.every(function (p) {
      return diferencas[p] !== null && diferencas[p] >= r.consistencia_diferenca;
    });

    return { medias: medias, roda: roda, porEmocao: porEmocao, consistencia: { diferencas: diferencas, aviso: aviso } };
  }

  function passoIndicado(faixa, indice, reguas) {
    if (faixa === "negativo" || faixa === "pouca") return 1;
    if (faixa === "transicao") return 2;
    return indice >= reguas.fluxo_perto ? 4 : 3;
  }

  function apurar(conteudo, estado) {
    var p1 = apurarParte1(conteudo.situacoes, estado.ordens || {}, conteudo.reguas);
    var p2 = apurarParte2(conteudo, estado.respostas || {});
    var principal = p1.principal;
    var faixaPrincipal = p2.porEmocao[principal].faixa;
    var porPresenca = ORDEM.slice().sort(function (x, y) {
      return p2.porEmocao[y].presenca - p2.porEmocao[x].presenca || ORDEM.indexOf(x) - ORDEM.indexOf(y);
    });
    var convergente = porPresenca.slice(0, 2).indexOf(principal) !== -1;
    return {
      p1: p1, p2: p2, principal: principal, faixaPrincipal: faixaPrincipal,
      porPresenca: porPresenca, convergente: convergente, maisPresente: porPresenca[0],
      passo: passoIndicado(faixaPrincipal, p1.indice, conteudo.reguas)
    };
  }

  var API = { ORDEM: ORDEM, PARES: PARES, apurarParte1: apurarParte1, apurarParte2: apurarParte2,
              passoIndicado: passoIndicado, apurar: apurar };
  if (typeof module === "object" && module.exports) module.exports = API;
  else raiz.Calculo = API;
})(typeof window !== "undefined" ? window : globalThis);

</script>

(function (raiz) {
  "use strict";

  // "triagem" só é usada pelo Modo Descoberta (protótipo v2).
  var PERFIS = [

<script>
/* Regras do Modo Descoberta: subconjunto do banco por etapa, filas sem
   repetição de célula, segmento da triagem, palavras do tipo do negócio,
   situações direcionadas e variantes de cena, linhas por segmento e simulação
   de perfis. Funções puras, usadas pela página e pelos testes em Node. */
(function (raiz) {
  "use strict";

  var ORDEM = ["T", "M", "A", "R"];

  function rng(semente) {
    var a = semente | 0;
    return function () {
      a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function embaralhar(lista, rnd) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  // Ordem balanceada das quatro reações numa etapa (ok do Zamir, 06/10):
  // 1) nas situações 1 a 4, cada emoção passa uma vez por cada posição;
  // 2) na 5ª, nenhuma emoção repete a posição que teve na 4ª;
  // 3) de uma situação para a seguinte, a lista nunca apenas gira.
  function repetePosicao(a, b) { return a.some(function (e, p) { return b[p] === e; }); }
  function soGira(a, b) {
    return [1, 2, 3].some(function (k) { return a.every(function (e, p) { return b[(p + k) % a.length] === e; }); });
  }
  function ordensBalanceadas(ids, rnd) {
    for (var tentativa = 0; tentativa < 1000; tentativa++) {
      var linhas = [], falhou = false;
      for (var s = 0; s < ids.length && !falhou; s++) {
        var bloco = linhas.slice(Math.floor(s / 4) * 4), anterior = linhas[s - 1], linha = null;
        for (var t = 0; t < 300; t++) {
          var cand = embaralhar(ORDEM, rnd);
          var proibido = bloco.some(function (x) { return repetePosicao(x, cand); }) ||
            (anterior && (repetePosicao(anterior, cand) || soGira(anterior, cand)));
          if (!proibido) { linha = cand; break; }
        }
        if (!linha) falhou = true; else linhas.push(linha);
      }
      if (!falhou) {
        var mapa = {};
        ids.forEach(function (id, i) { mapa[id] = linhas[i]; });
        return mapa;
      }

  }

  function celulas(C, e) {
    var pos = null, neg = null;
    C.celulas.forEach(function (c) {
      if (c.emocao !== e) return;
      if (c.lado === "positivo") pos = c.codigo; else neg = c.codigo;
    });
    return { pos: pos, neg: neg };
  }

  function idsEtapa2(C, D, principal) {
    var c = celulas(C, principal);
    return D.subconjunto[c.pos].quatro.concat(D.subconjunto[c.neg].quatro);
  }

  function idsEtapa3(C, D, principal) {
    var ids = [];
    ORDEM.forEach(function (e) {
      if (e === principal) return;
      var c = celulas(C, e);
      ids = ids.concat(D.subconjunto[c.pos].dois, D.subconjunto[c.neg].dois);
    });
    return ids;
  }

  function celulaDe(C) {
    var m = {};
    C.afirmacoes.forEach(function (a) { m[a.id] = a.celula; });
    return m;
  }

  // Embaralha sem duas afirmações da mesma célula em sequência.
  function filaSemRepetir(C, ids, rnd) {
    var cel = celulaDe(C);
    for (var tentativa = 0; tentativa < 300; tentativa++) {
      var fila = embaralhar(ids, rnd), ok = true;
      for (var i = 1; i < fila.length; i++) if (cel[fila[i]] === cel[fila[i - 1]]) { ok = false; break; }
      if (ok) return fila;
    }
    return ids.slice();
  }

  // Situações por id: as do banco e as direcionadas (D1, D2), que têm a cena
  // por segmento e um conjunto fixo de reações.
  function situacoesDe(C, D, ids) {
    var m = {};
    C.situacoes.forEach(function (s) { m[s.id] = s; });
    return ids.map(function (id) {
      if (m[id]) return m[id];
      var d = D && D.direcionadas && D.direcionadas[id];
      if (!d) throw new Error("situação desconhecida: " + id);
      return { id: id, contexto: "segmento", direcionada: true, cena: null, reacoes: null };
    });
  }

  // Segmento que direciona as cenas.
  function segmentoDe(est) {
    if (est.ocupacao === "colaborador") return est.lidera ? "lider" : "colaborador";
    return est.ocupacao || "colaborador";
  }

  function triagemCompleta(est) {
    if (!est.ocupacao) return false;
    if (est.ocupacao === "negocio" && !est.tipoNegocio) return false;
    if (est.ocupacao === "colaborador" && est.lidera !== true && est.lidera !== false) return false;
    return est.filhos === true || est.filhos === false;
  }

  // Palavras do tipo do negócio dentro dos textos.
  function tokens(D, est) {
    var t = D.tokens_tipo;
    return (est.ocupacao === "negocio" && est.tipoNegocio && t[est.tipoNegocio]) || t.padrao;
  }
  function aplicarTokens(D, est, texto) {
    if (!texto) return texto;
    var tk = tokens(D, est);

  }

  // A situação como a pessoa vê: a cena do seu segmento, com as reações da
  // base e as trocas pontuais da variante, e as palavras do tipo do negócio.
  // A linha da situação direcionada: a moldura da emoção com o encaixe da cena.
  function compor(d, c, e) {
    var linha = d.molduras[e].replace("{encaixe}", c.encaixes[e]);
    return linha.replace("{gatilho}", c.encaixes.gatilho || "aconteceu");
  }
  function comporDirecionada(D, did, seg, e) {
    var d = D.direcionadas[did], c = d.cenas[seg] || d.cenas.colaborador;
    return compor(d, c, e);

  function situacaoPara(D, est, s) {
    var seg = segmentoDe(est), cena = s.cena, base = s.reacoes, trocas = null, objetos = null;
    if (s.direcionada) {
      var d = D.direcionadas[s.id], c = d.cenas[seg] || d.cenas.colaborador;
      cena = c.cena; base = {}; objetos = c.objetos || null;
      ORDEM.forEach(function (e) { base[e] = compor(d, c, e); });
    } else {
      objetos = (D.racional && D.racional.objetos && D.racional.objetos[s.id]) || null;
      var v = D.variantes && D.variantes[s.id], escolhida = null;
      if (v) {
        if (v.filhos && est.filhos === true) escolhida = v.filhos;
        else { escolhida = v[seg] || null; if (!escolhida && seg === "lider") escolhida = v.colaborador || null; }
      }
      if (escolhida) { cena = escolhida.cena; trocas = escolhida.reacoes || null; }
    }
    var reacoes = {}, obj = null;
    ORDEM.forEach(function (e) { reacoes[e] = aplicarTokens(D, est, (trocas && trocas[e]) || base[e]); });
    if (objetos) { obj = {}; ORDEM.forEach(function (e) { obj[e] = aplicarTokens(D, est, objetos[e]); }); }
    return { id: s.id, contexto: s.contexto, cena: aplicarTokens(D, est, cena), reacoes: reacoes, objetos: obj };
  }

  function linhaContexto(D, est, passo) {
    var L = D.linhas_contexto && D.linhas_contexto[String(passo)];
    if (!L) return null;
    var seg = segmentoDe(est), linha = null;
    if (seg === "negocio" && passo === 1 && est.tipoNegocio && L["negocio_" + est.tipoNegocio]) linha = L["negocio_" + est.tipoNegocio];
    else linha = L[seg] || null;
    return aplicarTokens(D, est, linha);
  }

  function espelho(D, est, emocao) {
    var E = D.espelho && D.espelho[segmentoDe(est)];
    return E ? aplicarTokens(D, est, E[emocao]) : null;
  }

  function linhaFilhos(D, est, emocao) {
    return est.filhos === true && D.filhos_linhas ? D.filhos_linhas[emocao] : null;
  }

  function mundo(D, est, forma) {
    var m = D.mundo && D.mundo[segmentoDe(est)];
    return m ? m[forma] : "";
  }

  function ponteLado(D, emocao, faixa) {
    var p = D.ponte_lado && D.ponte_lado[emocao];
    if (!p) return null;
    if (faixa === "negativo") return p.domina;
    if (faixa === "positivo") return p.serve;
    return null;
  }

  // Estado simulado do Modo Descoberta a partir de um perfil: triagem, ordens
  // das 10 situações e respostas só das afirmações que a jornada mostra.
  function simular(C, D, Calc, Perfis, perfil) {
    var cheio = Perfis.gerar(C, perfil), tri = perfil.triagem || {};
    var ids = D.situacoes_e1.concat(D.situacoes_e4), ordens = {};
    ids.forEach(function (id, i) { ordens[id] = cheio.ordens[id] ? cheio.ordens[id].slice() : perfil.ordem(i).slice(); });
    var r1 = Calc.apurarParte1(situacoesDe(C, D, D.situacoes_e1), ordens, C.reguas);
    var P = r1.principal, respostas = {};
    idsEtapa2(C, D, P).concat(idsEtapa3(C, D, P)).forEach(function (id) { respostas[id] = cheio.respostas[id]; });
    return { ordens: ordens, respostas: respostas, principalE1: P, nome: tri.nome || "", ocupacao: tri.ocupacao || "colaborador",
             tipoNegocio: tri.tipoNegocio || null, lidera: tri.lidera === true, filhos: tri.filhos === true,
             email: "exemplo@ibn.com.br", whatsapp: "51 99999 9999" };
  }

  // Estado da ordenação na tela: chave do prompt, rótulo do botão e progresso.
  function promptDe(ordem) { var n = (ordem || []).length; return "situacao_prompt_" + (n >= 3 ? 3 : n); }
  function rotuloAvancar(i, total) { return i + 1 < total ? "situacao_proxima" : "situacao_concluir"; }
  function progresso(feitos, total) { return total ? Math.round(100 * feitos / total) : 0; }

  var API = { ORDEM: ORDEM, rng: rng, embaralhar: embaralhar, celulas: celulas, idsEtapa2: idsEtapa2, idsEtapa3: idsEtapa3,
              filaSemRepetir: filaSemRepetir, situacoesDe: situacoesDe, segmentoDe: segmentoDe, triagemCompleta: triagemCompleta,
              tokens: tokens, aplicarTokens: aplicarTokens, situacaoPara: situacaoPara, linhaContexto: linhaContexto,
              espelho: espelho, linhaFilhos: linhaFilhos, mundo: mundo, ponteLado: ponteLado, simular: simular,
              promptDe: promptDe, rotuloAvancar: rotuloAvancar, progresso: progresso, comporDirecionada: comporDirecionada,
              ordensBalanceadas: ordensBalanceadas, repetePosicao: repetePosicao, soGira: soGira };
  if (typeof module === "object" && module.exports) module.exports = API;
  else raiz.Descoberta = API;
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* Desenho da Roda da Harmonização das Emoções em SVG, com as oito fatias de
   0 a 10. Compartilhado pelos protótipos. */
(function (raiz) {
  "use strict";

  var R = { cx: 220, cy: 220, rCubo: 16, rMax: 146, rEtqIn: 150, rEtqOut: 178, rBandaIn: 180, rBandaOut: 206,
    fatias: [["HU", -135, -90], ["VI", -90, -45], ["PL", -45, 0], ["FC", 0, 45], ["MO", 45, 90], ["EU", 90, 135], ["IM", 135, 180], ["IP", 180, 225]],
    bandas: [["T", -135, -45], ["M", -45, 45], ["A", 45, 135], ["R", 135, 225]] };

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function num(v) { return Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function f2(v) { return Math.round(v * 100) / 100; }
  function ponto(r, ang) { var a = ang * Math.PI / 180; return [f2(R.cx + r * Math.cos(a)), f2(R.cy + r * Math.sin(a))]; }
  function setor(r1, r2, a1, a2) {
    var p1 = ponto(r2, a1), p2 = ponto(r2, a2);
    if (r1 <= 0) return "M" + R.cx + " " + R.cy + " L" + p1.join(" ") + " A" + r2 + " " + r2 + " 0 0 1 " + p2.join(" ") + " Z";
    var p3 = ponto(r1, a2), p4 = ponto(r1, a1);
    return "M" + p1.join(" ") + " A" + r2 + " " + r2 + " 0 0 1 " + p2.join(" ") + " L" + p3.join(" ") + " A" + r1 + " " + r1 + " 0 0 0 " + p4.join(" ") + " Z";
  }
  function arcoTexto(id, r, a1, a2, emBaixo) {
    var ini = emBaixo ? ponto(r, a2) : ponto(r, a1), fim = emBaixo ? ponto(r, a1) : ponto(r, a2);
    return '<path id="' + id + '" d="M' + ini.join(" ") + " A" + r + " " + r + " 0 0 " + (emBaixo ? 0 : 1) + " " + fim.join(" ") + '" fill="none"/>';
  }
  function raioDe(v) { return R.rCubo + (Math.max(0, Math.min(10, v)) / 10) * (R.rMax - R.rCubo); }

  /* roda: valores 0 a 10 por célula; prefixo: id único na página; nomes: {celula: nome}; emocoes: {codigo: nome}; emocaoDe: {celula: codigo}. */
  function desenhar(roda, prefixo, nomes, emocoes, emocaoDe) {
    var s = '<svg class="roda" viewBox="0 0 440 440" role="img" aria-label="Roda da Harmonização das Emoções com as oito fatias de 0 a 10"><defs>';
    R.fatias.forEach(function (f) {
      var emBaixo = f[0] === "MO" || f[0] === "EU";
      s += arcoTexto(prefixo + "-etq-" + f[0], emBaixo ? R.rEtqOut - 9 : R.rEtqIn + 9, f[1], f[2], emBaixo);
    });
    R.bandas.forEach(function (b) {
      var emBaixo = b[0] === "A";
      s += arcoTexto(prefixo + "-banda-" + b[0], emBaixo ? R.rBandaOut - 9 : R.rBandaIn + 9, b[1], b[2], emBaixo);
    });
    s += '</defs>';
    R.bandas.forEach(function (b) {
      s += '<path class="banda-' + b[0] + '" d="' + setor(R.rBandaIn, R.rBandaOut, b[1] + 0.4, b[2] - 0.4) + '"/>';
      s += '<text class="texto-banda texto-banda-' + b[0] + '"><textPath href="#' + prefixo + '-banda-' + b[0] + '" startOffset="50%" text-anchor="middle">' + esc(emocoes[b[0]].toUpperCase()) + '</textPath></text>';
    });
    R.fatias.forEach(function (f) {
      s += '<path class="anel" d="' + setor(R.rEtqIn, R.rEtqOut, f[1] + 0.4, f[2] - 0.4) + '"/>';
      s += '<text class="rotulo"><textPath href="#' + prefixo + '-etq-' + f[0] + '" startOffset="50%" text-anchor="middle">' + esc(nomes[f[0]]) + '</textPath></text>';
      s += '<path class="fundo" d="' + setor(0, R.rMax, f[1], f[2]) + '"/>';
    });
    [2, 4, 6, 8, 10].forEach(function (v) { s += '<circle class="grade" cx="' + R.cx + '" cy="' + R.cy + '" r="' + f2(raioDe(v)) + '"/>'; });
    R.fatias.forEach(function (f) {
      var v = roda[f[0]] || 0, emo = emocaoDe[f[0]];
      if (v > 0) s += '<path class="w-' + emo + '" d="' + setor(0, raioDe(v), f[1] + 1.2, f[2] - 1.2) + '"/>';
      var meio = (f[1] + f[2]) / 2;
      var p = ponto(Math.max(R.rCubo + 16, Math.min(R.rMax - 12, raioDe(v) + 13)), meio);
      s += '<text class="valor-fatia" x="' + p[0] + '" y="' + p[1] + '" text-anchor="middle" dominant-baseline="middle">' + num(v) + '</text>';
    });
    s += '<circle class="cubo" cx="' + R.cx + '" cy="' + R.cy + '" r="' + R.rCubo + '"/></svg>';
    return s;
  }

  var API = { desenhar: desenhar };
  if (typeof module === "object" && module.exports) module.exports = API;
  else raiz.Roda = API;
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* Interface do protótipo v2: Modo Descoberta, para locais parceiros.
   Revisão 2: triagem na abertura, tela de entrada por etapa e cenas por segmento.
   Revisão 3 (bloco A+B): localização no cabeçalho, Como Responder, prompt por estado. */
(function () {
  "use strict";

  var C = JSON.parse(document.getElementById("conteudo").textContent);
  var D = C.descoberta;
  var Calc = window.Calculo, Roda = window.Roda, Perfis = window.Perfis, Desc = window.Descoberta;
  var CHAVE = "modelo-emocional-descoberta-" + C.versao + "-" + D.versao;
  var ORDEM = ["T", "M", "A", "R"];
  var EMO = {}, CEL = {}, AFIRM = {}, T = {}, TD = {}, NOMES_CEL = {}, NOMES_EMO = {}, EMO_DE_CEL = {};
  C.emocoes.forEach(function (e) { EMO[e.codigo] = e; NOMES_EMO[e.codigo] = e.nome; });
  C.celulas.forEach(function (c) { CEL[c.codigo] = c; NOMES_CEL[c.codigo] = c.nome; EMO_DE_CEL[c.codigo] = c.emocao; });
  C.afirmacoes.forEach(function (a) { AFIRM[a.id] = a; });
  C.telas.forEach(function (t) { T[t.chave] = t.texto; });
  D.telas.forEach(function (t) { TD[t.chave] = t.texto; });
  var SIT1 = Desc.situacoesDe(C, D, D.situacoes_e1), SIT4 = Desc.situacoesDe(C, D, D.situacoes_e4);
  var FUNCAO_CURTA = { T: "Humildade", M: "Planejamento", A: "Motivação", R: "Impulso" };
  var raiz = document.getElementById("app");

  var estado = null, visao = null, confirmandoRecomeco = false, erros = {}, racionalLigado = false;
  var CHAVE_RACIONAL = "modelo-emocional-validacao";
  // No protótipo o racional vem ligado; a pessoa desliga antes de passar o celular. No app esse modo não existe.
  function lerRacional() { try { return localStorage.getItem(CHAVE_RACIONAL) !== "0"; } catch (e) { return true; } }
  function gravarRacional(v) { try { localStorage.setItem(CHAVE_RACIONAL, v ? "1" : "0"); } catch (e) { /* sem armazenamento */ } }

  // ------------------------------------------------------------------ util
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function num(v, casas) { return Number(v).toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas }); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function comArtigo(cod) { return EMO[cod].artigo + " " + EMO[cod].nome.toLowerCase(); }
  function contracao(cod) { return (EMO[cod].artigo === "a" ? "da " : "do ") + EMO[cod].nome; }
  function emArtigo(cod) { return (EMO[cod].artigo === "a" ? "na " : "no ") + EMO[cod].nome.toLowerCase(); }
  function deArtigo(cod) { return (EMO[cod].artigo === "a" ? "da " : "do ") + EMO[cod].nome.toLowerCase(); }
  function tituloEtapa(n) {
    // Título em Title Case: "Por Dentro da Alegria".
    return preencher(TD["etapa" + n + "_titulo"], { de_e: estado.principalE1 ? contracao(estado.principalE1) : "da Emoção" });
  }
  function preencher(modelo, vars) { return modelo.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; }); }
  function nomeDe(est) { return (est.nome || "").trim(); }
  function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* sem armazenamento */ } }
  function carregar() {
    try { var s = JSON.parse(localStorage.getItem(CHAVE) || "null"); if (versaoAtual(s)) return s; } catch (e) { /* sem armazenamento */ }
    return null;
  }
  // O estado só é reaproveitado se o banco e o Modo Descoberta forem da mesma versão.
  function versaoAtual(s) { return !!s && s.versao === C.versao && s.versaoDescoberta === D.versao; }
  function novoEstado() {
    var semente = Math.floor(Math.random() * 1e9), rnd = Desc.rng(semente), opcoes = {};
    // Ordem balanceada por etapa: cada emoção passa por todas as posições e nunca repete o lugar da situação anterior.
    [SIT1, SIT4].forEach(function (lista) {
      var mapa = Desc.ordensBalanceadas(lista.map(function (s) { return s.id; }), rnd);
      Object.keys(mapa).forEach(function (id) { opcoes[id] = mapa[id]; });
    });
    return { versao: C.versao, versaoDescoberta: D.versao, semente: semente, etapa: "abertura", i: 0, nome: "", ocupacao: null, tipoNegocio: null, lidera: null, filhos: null,
             email: "", whatsapp: "", optin: false, idade: null, sexo: null, opcoes: opcoes, ordens: {}, respostas: {}, principalE1: null, filaE2: [], filaE3: [] };
  }
  function temProgresso() { return estado && (Object.keys(estado.ordens).length > 0 || Object.keys(estado.respostas).length > 0 || (estado.nome || "").length > 0 || !!estado.ocupacao); }

  // ------------------------------------------------------------------ apuração por etapa
  function apurarE1(est) { return Calc.apurarParte1(SIT1, est.ordens, C.reguas); }
  function apurarP2(est) { return Calc.apurarParte2(C, est.respostas); }
  function apurarFinal(est) {
    var respondidas = SIT1.concat(SIT4).filter(function (s) { return (est.ordens[s.id] || []).length === 4; });
    var copia = {}; Object.keys(C).forEach(function (k) { copia[k] = C[k]; }); copia.situacoes = respondidas;
    return Calc.apurar(copia, est);
  }
  function garantirFilas() {
    if (!estado.principalE1) estado.principalE1 = apurarE1(estado).principal;
    var rnd = Desc.rng(estado.semente + 7);
    if (!estado.filaE2.length) estado.filaE2 = Desc.filaSemRepetir(C, Desc.idsEtapa2(C, D, estado.principalE1), rnd);
    if (!estado.filaE3.length) estado.filaE3 = Desc.filaSemRepetir(C, Desc.idsEtapa3(C, D, estado.principalE1), rnd);
  }

  // ------------------------------------------------------------------ pedaços de tela
  function topo(n, contador, feitos, total) {
    return '<header class="topo"><div class="topo-linha"><strong>' + esc(TD["entrada" + n + "_eyebrow"]) + '</strong><span>' + esc(contador) + '</span></div>' +
      '<div class="progresso" aria-hidden="true"><span style="width:' + Desc.progresso(feitos, total) + '%"></span></div>' +
      (racionalLigado ? '<div class="aviso-validacao"><span>' + esc(TD.validacao_aviso) + '</span><button class="botao botao-texto" data-acao="racional-desligar">' + esc(TD.validacao_desligar) + '</button></div>' : '') + '</header>';
  }
  function marcaExemplo(nome) { return nome ? '<span class="marca-exemplo">Exemplo simulado: ' + esc(nome) + '</span>' : ''; }
  function pararAqui() { return '<p class="parar">' + esc(TD.parar_aqui) + '</p>'; }
  function convite(texto, botao, acao) {
    return '<div class="convite"><p>' + esc(texto) + '</p><button class="botao botao-primario" data-acao="' + acao + '">' + esc(botao) + '</button></div>';
  }
  function chips(acao, opcoes, atual) {
    var h = '<div class="escolhas escolhas-linha">';
    opcoes.forEach(function (o) { h += '<button data-acao="' + acao + '" data-valor="' + o.codigo + '" aria-pressed="' + (atual === o.codigo) + '">' + esc(o.rotulo) + '</button>'; });
    return h + '</div>';
  }

  // ------------------------------------------------------------------ racional de validação (só no protótipo)
  function painelRacional(linhas) {
    var h = '<details class="racional"><summary aria-label="' + esc(TD.racional_abrir) + '" title="' + esc(TD.racional_abrir) + '">?</summary><div class="racional-painel">';
    linhas.forEach(function (l) { if (l[1]) h += '<p><strong>' + esc(l[0]) + ':</strong> ' + esc(l[1]) + '</p>'; });
    return h + '</div></details>';
  }
  function racionalDaSituacao(s) {
    var R = D.racional || {}, e1 = R.etapa1 || {}, fam = (R.familias || {})[s.id];
    var linhas = [[TD.racional_mede, e1.mede], [TD.racional_familia, fam]];
    if (s.objetos) linhas.push([TD.racional_objetos, "Perda: " + s.objetos.T + ". Risco: " + s.objetos.M + ". Possibilidade: " + s.objetos.A + ". Agente: " + s.objetos.R + "."]);
    linhas.push([TD.racional_ordem, e1.ordem], [TD.racional_lado, e1.lado]);
    if (!fam) linhas.push([TD.racional_nota, R.etapa4 && R.etapa4.nota]);
    return painelRacional(linhas);
  }
  function racionalDaResposta(s, e) {
    var R = D.racional || {}, info = (R.emocoes || {})[s.id] && R.emocoes[s.id][e];
    var linhas = [[TD.racional_emocao, EMO[e].nome + ". " + EMO[e].funcao]];
    if (info) {
      linhas.push([TD.racional_foco, info.foco], [TD.racional_impulso, info.impulso], [TD.racional_reconhece, info.reconhece], [TD.racional_antes, info.antes],
        [TD.racional_lados, info.lado_positivo + ". " + info.lado_negativo + "."], [TD.racional_confusao, info.confusao], [TD.racional_leituras, info.admiravel + " / " + info.criticavel]);
    } else {
